services:
  - type: web
    name: iv-curve-service
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        value: your_jwt_secret_key
      - key: DATABASE_URL
        fromDatabase:
          name: your-database
          property: connectionString
    healthCheckPath: /healthz

databases:
  - name: your-database
    databaseName: ivcurve
    user: ivcurve_user
    plan: starter
